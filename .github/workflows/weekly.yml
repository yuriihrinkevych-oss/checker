name: weekly-market-scan

on:
  schedule:
    - cron: "0 3 * * 1"   # щопонеділка о 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scan_markets.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "markets: $(date -u +%F)"
            git pull --rebase
            git push
          fi
