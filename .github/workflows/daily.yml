name: daily-competitor-tracker

on:
  schedule:
    - cron: "0 6 * * *"   # щодня о 06:00 UTC (08:00/09:00 у Варшаві)
  workflow_dispatch:       # кнопка "Run workflow" для ручного запуску

permissions:
  contents: write          # щоб бот міг закомітити нові дані

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - run: python build_viewer.py
      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data reports viewer.html
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +%F)"
            git pull --rebase
            git push
          fi
