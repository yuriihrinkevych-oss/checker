<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вітрина конкурентів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F3; --surface:#FFFFFF; --ink:#18212B; --muted:#5D6876; --line:#D5DBE1;
  --accent:#0B6E69; --accent-soft:#DDEDEB; --change:#B26A00; --change-soft:#F6E9D4;
  --radius-page:22px; --radius-img:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A21; --surface:#1C242D; --ink:#E6EBF0; --muted:#97A3B0; --line:#2D3742;
    --accent:#4FC2BA; --accent-soft:#16312F; --change:#E3A445; --change-soft:#3A2C14;
  }
}
:root[data-theme="dark"]{
  --paper:#141A21; --surface:#1C242D; --ink:#E6EBF0; --muted:#97A3B0; --line:#2D3742;
  --accent:#4FC2BA; --accent-soft:#16312F; --change:#E3A445; --change-soft:#3A2C14;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- верхня панель ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  border-bottom:1px solid var(--line)}
.top-inner{max-width:1240px;margin:0 auto;padding:14px 24px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px 11px;cursor:pointer;display:flex;align-items:center;gap:8px;
  color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab img{width:22px;height:22px;border-radius:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .own{font-size:11px;color:var(--accent);font-weight:600}
.tab-sep{width:1px;background:var(--line);margin:8px 6px 10px;flex:none}

main{max-width:1240px;margin:0 auto;padding:24px}

/* ---------- сторінка апки ---------- */
.app-view{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.app-view{grid-template-columns:1fr}}
.picker{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-width:440px}
.picker label{font-size:13px;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}

.store{background:var(--surface);border-radius:var(--radius-page);padding:22px 20px 24px;
  border:1px solid var(--line)}
.store-head{display:flex;gap:16px;align-items:flex-start}
.store-head img{width:72px;height:72px;border-radius:18px;flex:none;background:var(--paper)}
.store-title{font-size:22px;line-height:1.25;font-weight:600;margin:0 0 4px}
.store-dev{color:var(--accent);font-weight:500;font-size:14px}
.store-flags{color:var(--muted);font-size:12px;margin-top:2px}
.stats{display:flex;margin:18px 0 6px;padding:0;list-style:none}
.stats li{flex:1;text-align:center;padding:0 6px;border-left:1px solid var(--line)}
.stats li:first-child{border-left:0}
.stats b{display:block;font-size:15px;font-weight:600}
.stats span{font-size:12px;color:var(--muted)}
.shots{display:flex;gap:8px;overflow-x:auto;margin:16px -20px 4px;padding:0 20px 8px;scroll-snap-type:x proximity}
.shots button{flex:none;border:0;padding:0;background:none;cursor:zoom-in;scroll-snap-align:start}
.shots img{height:240px;border-radius:var(--radius-img);display:block;background:var(--paper)}
.store h3{font-size:17px;font-weight:600;margin:18px 0 6px}
.summary{margin:0 0 8px}
.desc{white-space:pre-line;color:var(--ink);font-size:14px;max-height:9.5em;overflow:hidden;position:relative}
.desc.open{max-height:none}
.desc:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;
  background:linear-gradient(transparent,var(--surface))}
.linkish{border:0;background:none;color:var(--accent);padding:6px 0;cursor:pointer;font-weight:500}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:14px 0 0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.empty{color:var(--muted);padding:28px 20px;border:1px dashed var(--line);border-radius:var(--radius-page)}

/* ---------- права колонка ---------- */
.side section{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid var(--line)}
.side section:last-child{border-bottom:0}
.side h2{font-size:16px;font-weight:600;margin:0 0 10px}
.note{color:var(--muted);font-size:13px;margin:6px 0 0}
.big{font-size:26px;font-weight:600;letter-spacing:-.01em}
.row{display:flex;gap:28px;flex-wrap:wrap}
.row div span{display:block;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--surface);cursor:pointer}
.chip.strong{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log time{color:var(--muted);font-size:13px}
.log .where{color:var(--muted);font-size:13px}
.mark{background:var(--change-soft);color:var(--change);border-radius:4px;padding:0 5px;font-size:12px;font-weight:600;margin-right:6px}
svg.chart{width:100%;height:150px;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:inherit}

/* ---------- порівняння ---------- */
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:16px;overflow-x:auto;padding-bottom:12px}
.compare .store{padding:18px 16px}
.compare .shots{margin:12px -16px 0;padding:0 16px 6px}
.compare .shots img{height:170px}
.compare .store-title{font-size:18px}
.compare .store.own-col{border:2px solid var(--accent)}
.compare .stats b{font-size:14px;white-space:nowrap}
.compare .stats span{white-space:nowrap}

/* ---------- ціни ---------- */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.own,th.own{background:var(--accent-soft)}
td.low{color:var(--accent);font-weight:600}
tr:last-child td{border-bottom:0}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* ---------- лайтбокс ---------- */
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:94vh}
dialog::backdrop{background:rgba(10,14,18,.82)}
dialog img{max-width:96vw;max-height:90vh;border-radius:12px;display:block}
dialog form{text-align:center;margin-top:8px}
dialog button{border:0;background:var(--surface);border-radius:8px;padding:6px 14px;cursor:pointer}

@media (prefers-reduced-motion: no-preference){
  .store{animation:in .18s ease-out}
  @keyframes in{from{opacity:.4}to{opacity:1}}
}
</style>
</head>

</div></header>
<main id="main"></main>

 de l'utilisateur :\r\nGeozilla accepte uniquement une utilisation mutuelle, éclairée et transparente du partage de localisation entre les parties consentantes, telles que les membres de la famille et les contacts proches. Notre application est basée sur les principes de confidentialité, de sécurité et de confiance.\r\n\r\n📱 Explication des autorisations de l'application :\r\nPour assurer les fonctionnalités de sécurité essentielles, Geozilla peut demander les autorisations suivantes:\r\nServices de localisation: requis pour activer le suivi GPS continu, les alertes de géorepérage et la détection d'accident.\r\nNotifications: utilisées pour envoyer des alertes importantes telles qu'une arrivée/un départ, un appel d'urgence.\r\nContacts (facultatif): simplifie l'invitation de contacts de confiance en vous permettant de choisir des numéros de téléphone dans votre carnet d'adresses.\r\nAppareil photo et photos : Utilisé pour définir des images de profil ou scanner des invitations par QR code.\r\nMouvement et forme physique: Améliore les rapports de conduite et la détection des accidents en surveillant les mouvements.\r\nLes autorisations sont demandées de manière transparente et expliquées en contexte. Les utilisateurs gardent le contrôle à tout moment et peuvent ajuster l'accès dans les paramètres de l'appareil.\r\n\r\nGeoZilla s'engage à respecter la confidentialité, la transparence et une utilisation responsable. Nous ne soutenons aucune utilisation de l'application sans la connaissance et le consentement de tous les participants.\r\nGeoZilla est conçu et commercialisé uniquement pour des cas d'utilisation liés à la sécurité familiale, tels que le suivi des enfants par leurs parents ou l'aide apportée aux personnes dépendantes par leurs aidants. Il ne prend pas en charge le suivi secret, les installations furtives ou l'activation à distance.\r\nSi vous avez besoin d'aide ou si vous avez des commentaires à propos de GeoZilla, contactez-nous à l'adresse suivante : sup  bezpieczeństwo dzięki raportom dotyczącym nawyków jazdy.\r\nWyszukiwarka AR.\r\nWykrywanie kolizji i alerty SOS.\r\n\r\nKompatybilność z Wear OS: Dowiedz się, gdzie znajduje się Twoja rodzina lub udostępnij swoją lokalizację bezpośrednio ze smartwatcha.\r\n\r\n🔒 Prywatność, przejrzystość i zgoda użytkownika:\r\nGeozilla obsługuje wyłącznie wzajemne, świadome i transparentne udostępnianie lokalizacji między stronami wyrażającymi na to zgodę – takimi jak członkowie rodziny i bliskie kontakty. Nasza aplikacja opiera się na zasadach prywatności, bezpieczeństwa i zaufania. Każda funkcja Geozilli wymaga wyraźnego udziału i zgody użytkownika:\r\nNikt nie może zostać dodany do Twojego kręgu bez jego wyraźnej zgody.\r\nDane o lokalizacji nie są udostępniane bez aktywnej zgody użytkownika.\r\nZaproszeni użytkownicy są informowani o tym, kto ich zaprosił, jaki jest cel aplikacji i jakie konkretne uprawnienia są wymagane.\r\nZachęcamy użytkowników do korzystania z Geozilli wyłącznie w celach związanych z bezpieczeństwem rodziny i opieką. Niewłaściwe wykorzystanie aplikacji do śledzenia bez zezwolenia lub bez świadomej zgody jest sprzeczne z naszą polityką i lokalnymi przepisami o ochronie prywatności.\r\n\r\n📱 Wyjaśnienie uprawnień aplikacji:\r\nAby zapewnić kluczowe funkcje bezpieczeństwa, Geozilla może żądać następujących uprawnień (za zgodą użytkownika na każdym etapie):\r\nUsługi lokalizacyjne (zawsze/dostęp w tle): Wymagane do ciągłego śledzenia GPS, alertów geofencingu i wykrywania kolizji – nawet gdy aplikacja nie jest aktywnie używana.\r\nPowiadomienia: Używane do wysyłania ważnych alertów, takich jak przyjazd/wyjazd, SOS, niski poziom baterii i aktywność aplikacji. Kontakty: Opcjonalnie – upraszcza zapraszanie zaufanych kontaktów, umożliwiając wybór numerów telefonów z książki adresowej.\r\nAparat i zdjęcia: Służy do ustawiania zdjęć profilowych lub skanowania zaproszeń QR.\r\nRuch i sprawność fizyczna (rozpoznawanie aktywności): Ulepsza raporty z jazdy i wykrywanie kolizji poprzez monitorowanie wzorców ruchu.\r\nUprawnienia są wymagane w sposób przejrzysty i wyjaśnione w kontekście. Użytkownicy zachowują pełną kontrolę i mogą dostosować dostęp w ustawieniach urządzenia.\r\n\r\nGeozilla dba o prywatność, przejrzystość i odpowiedzialne korzystanie z aplikacji. Nie wspieramy korzystania z aplikacji bez wiedzy i zgody wszystkich użytkowników.\r\nGeozilla została zaprojektowana i jest sprzedawana wyłącznie w celach związanych z bezpieczeństwem rodziny, takich jak śledzenie dzieci przez rodziców lub pomoc opiekunom w opiece nad osobami zależnymi. Nie obsługuje ukrytego śledzenia, instalacji ukrytych ani zdalnej aktywacji.\r\nJeśli potrzebujesz pomocy lub masz opinię na temat Geozilli, skontaktuj się z nami pod adresem: support@geozilla.com\r\nPolityka prywatności: https://geozilla.com/privacy-policy\r\nWarunki korzystania: https://geozilla.com/terms-of-use", "developer": "GZ TECH", "genre": "Styl życia", "headerImage": "https://play-lh.googleusercontent.com/bKkTJcBVFL2kVQeTBx4LC1Va9s8bUcCv1KHL_UkQynPVOD-N0iGB_i915fBgcIw9wKMybhK4CuL2AsHIwcBUP8A", "histogram": [263176, 14932, 29864, 89592, 361168], "icon": "https://play-lh.googleusercontent.com/i72e4U2jPc5WBB6JXrWoFfBXJbLJSgrMnDna3qPjDN9dQaONNbetQLS2JkUua-vqB4IW_WQ7y5IEMoHQLL_bSQ", "inAppProductPrice": "11,99 zł – 354,99 zł, jeśli rozliczasz się przez Play", "installs": "10 000 000+", "lastUpdatedOn": "2 paź 2026", "metrics": {"minInstalls": 10000000, "ratings": 760600, "realInstalls": 29664756, "reviews": 96, "score": 3.3564355}, "price": 0, "screenshots": ["https://play-lh.googleusercontent.com/dAwv9CfOD5uigKQMix-dR4EoOpyIFPXdi0sKxZjCverbrJI8HVCC_Q6wcS1TISXJFvD90yVrJl2ZzG-DgHSR", "https://play-lh.googleusercontent.com/pDYVSPPF_o8U-1uP8pyE076joyRhi9Sn0da5zvyD9mRw__527_gAbovUdyx_1CqTagbK0Uf1A6YPC1knj8hA", "https://play-lh.googleusercontent.com/wbiUSezwwfY61oI_JpWr2QQhZOOudGqnBWadyAiw2gSfebi9uDRSp8_tku7Q7yaSL1F1ERLO2ZObHfhMVP8O", "https://play-lh.googleusercontent.com/pOOnvK6z5Z1hpN_pII  wo Kinder, Partner oder Eltern gerade sind\r\n- Handy Standort der ganzen Familie auf einer Karte, GPS von Familie und Freunden an einem Ort\r\n- Ortswarnungen (Geofence): Du erfährst automatisch, wenn jemand zu Hause, in der Schule oder auf der Arbeit ankommt oder losgeht\r\n- Live Standort dauerhaft im Blick, ohne ständig nachzufragen\r\n\r\nFür Freunde\r\nTeile deinen Standort mit dem Kreis, der dir wichtig ist. Treffpunkte finden, sehen wer schon da ist, und im sicheren, privaten Chat Fotos und Nachrichten austauschen.\r\n\r\nGPS Tracker und Tracking App für Menschen, nicht für Geräte\r\nLife360 nutzt GPS-Standortdaten, um den Aufenthaltsort in Echtzeit anzuzeigen. Jedes Mitglied erscheint als eigenes Symbol auf der Karte. Die App läuft auf allen wichtigen Plattformen – installiere Life360 einfach auf jedem Handy im Kreis. Location Sharing, das alle sofort verstehen.\r\n\r\nHäufige Fragen\r\nWo ist mein Kind gerade? Öffne die Karte und du siehst den Live Standort sofort.\r\nWo bin ich? Life360 zeigt deine eigene Position genauso wie die der anderen.\r\nIst die Standort App kostenlos? Die Grundfunktionen sind kostenlos, Premium ist optional.\r\nKann ich den Standort von einer Person dauerhaft sehen? Ja, wenn sie in deinem Kreis ist und zugestimmt hat.\r\nErsetzt Life360 einen GPS Tracker als Gerät? Für Menschen ja – du brauchst kein zusätzliches Hardware-Gerät, nur die App.\r\n\r\nDas steckt drin\r\nOrtswarnungen: Sieh, wann deine Leute nach Hause kommen, die Arbeit verlassen oder beim Training ankommen.\r\nStandortverlauf: Eine fortlaufende Zeitleiste der Wege deines Kreises, nach Tagen sortiert. Sieh vergangene Fahrten und wie lange jemand wo war.\r\nSOS-Benachrichtigung: Fühl dich geschützt. Im Notfall sendet SOS einen lautlosen Hilfenotruf mit deinem Standort an deinen Kreis und deine Notfallkontakte.\r\nAkkuwarnung: Life360 zeigt den Batteriestand jedes Mitglieds und warnt dich, wenn er niedrig wird.\r\nFahrberichte: Fördere sicheres Fahren. Sieh Geschwindigkeit, Handynutzung am Steuer, scharfes Bremsen und starke Beschleunigung – und wer im Kreis am sichersten fährt.\r\n\r\nLife360 Premium\r\nSilber:\r\n- 7 Tage Standortverlauf\r\n- Bis zu 5 Orte mit unbegrenzten Alarmen\r\n- Premium-Alarme für Unfallerkennung und SOS\r\n- Vorrangiger Kundenservice\r\n- Plus alles aus der kostenlosen Version\r\nGold:\r\n- 30 Tage Standortverlauf\r\n- Unbegrenzte Orte mit unbegrenzten Alarmen\r\n- Berichte für Familien- und Einzelfahrer\r\n- Werbefreies Erlebnis\r\n- Plus alles aus der kostenlosen und der Silber-Version\r\n\r\nLade Life360 jetzt herunter und hab die Gewissheit, dass deine Lieben sicher sind. Bleib verbunden mit den Menschen, die zählen – schließ dich Millionen an, die Life360 zum Standort teilen nutzen.\r\n\r\nhttps://www.life360.com/privacy_policy/\r\nhttps://www.life360.com/terms_of_use/\r\n\r\nHaftungsausschluss: Die fortgesetzte Nutzung von Standortdiensten im Hintergrund kann den Akku stärker belasten. Unsere Algorithmen halten den Verbrauch so niedrig wie möglich, auch während der Fahrt.", "developer": "Life360", "genre": "Lifestyle", "headerImage": "https://play-lh.googleusercontent.com/4vgAffm33oP-5v2Vrl8sRYVujoz_fa8QaDXYm8W06MeyMkG_yXs1x_0-34_o1qof_S1fg9CRrnO66ZGIKrtt7w", "histogram": [45723, 37216, 95788, 384218, 1875368], "icon": "https://play-lh.googleusercontent.com/nQsrQf5cd6IeIhFTvVFjez12UiB1QTYYyX1UiVA448XkK--5jQYBhDuiMHtBOWrVnoldLTlnUN1x3AbCt4vflg", "inAppProductPrice": "1,59 €–264,99 € bei Abrechnung über Google Play", "installs": "100.000.000+", "lastUpdatedOn": "02.10.2026", "metrics": {"minInstalls": 100000000, "ratings": 2438493, "realInstalls": 223710409, "reviews": 10786, "score": 4.6429505}, "price": 0, "screenshots": ["https://play-lh.googleusercontent.com/ykILSASJghX9OkTgyEUvcD2j5Qeo58Dl2DKXTGFXu5ykJOIzQDf7SaDnOYb-647Z110m_ngYxpUSgEat0AjzBg", "https://play-lh.googleusercontent.com/rDpzXuTxmPNw-Yp1VPr4ewLm689rngTgDxXSKL_pGeYaYrx7yrHuMrugj5WD8jSw3M0SuvyCVQjudFUNFs8B", "https://play-lh.googleus o, sem precisar ligar o tempo todo.\r\n\r\n• Controle parental do uso de apps  \r\nMonitore quanto tempo seu filho passa em aplicativos enquanto está na escola ou fora de casa. Com o controle parental você entende melhor como o celular é usado e pode conversar sobre hábitos digitais mais seguros sem invadir a privacidade de my kids.\r\n\r\n• Escuta do som ao redor em tempo real  \r\nAtive a função de escutar o som ao redor do aparelho da criança quando precisar ter certeza de que ela está segura. Essa função ajuda a avaliar a situação perto de mykids família em momentos de preocupação, sempre dentro das regras da sua família.\r\n\r\n• Toque alto que ignora o modo silencioso  \r\nEnvie um sinal sonoro alto para o celular da criança, mesmo se estiver no silencioso ou dentro da mochila. Esse alerta do rastreador de celular ajuda a chamar a atenção de my kids rapidamente quando eles não atendem às ligações ou não veem suas mensagens.\r\n\r\n• Previsão inteligente de rota com IA  \r\nReceba ajuda da previsão de rota para entender se o caminho escolhido pelo seu filho é seguro. A combinação de geolocalização e análise de trajeto mostra quando my kids se desvia muito da rota habitual, para que você possa agir com antecedência.\r\n\r\n• Alertas de movimento e zonas importantes  \r\nAdicione locais importantes como casa, escola ou atividades e receba alertas quando a criança chegar ou sair. Esses avisos do GPS rastreador de família mantêm você informado sobre os movimentos de mykids e reduzem a ansiedade do dia a dia.\r\n\r\nAlém disso, Find my kids envia alerta quando a bateria do celular está baixa, para você lembrar my kids de carregar o aparelho, e oferece um chat conveniente para trocar mensagens de texto e voz com seu filho.\r\n\r\nSe você encontrar qualquer problema técnico ao usar o Findmykids, pode sempre entrar em contato com o suporte 24/7 do Findmykids pelo chat no app ou por e-mail em support@findmykids.org. Estamos sempre prontos para ajudar!\r\n\r\nVocê pode s r les familles. Elle réunit géolocalisation téléphone et contrôle parental pour que vous sachiez toujours où se trouve votre enfant et comment il se déplace. Sur la carte, vous voyez la position GPS en temps réel et l’historique des trajets, ce qui facilite la localisation d’un portable par numéro et rassure toute la famille. Je peux me localiser et vérifier ma position GPS, mais surtout localiser mon appareil de l’enfant en un regard, de manière claire et sûre.\r\n\r\nNotre traceur de téléphone met l’accent sur la précision de la position GPS et la clarté du suivi de la position. Vous recevez des notifications utiles quand l’enfant arrive ou quitte un lieu, et vous pouvez, si besoin, écouter ce qui se passe autour pour vérifier que tout va bien. Même si le téléphone est en mode silencieux, vous envoyez un signal sonore puissant afin de le retrouver rapidement. Avec le contrôle parental, vous surveillez le temps passé sur les applications pendant l’école et aidez votre enfant à garder de bonnes habitudes numériques. En cas d’urgence, un bouton SOS permet à l’enfant de vous prévenir immédiatement.\r\n\r\nFonctionnalités clés:\r\n- Localisation et trajet de l’enfant en direct: consultez la position actuelle en temps réel et la liste des lieux visités dans la journée.\r\n- Contrôle parental: suivez le temps passé sur les applications, notamment pendant l’école, depuis l’application de traqueur.\r\n- Écoute du son ambiant en direct: entendez ce qui se passe autour de l’enfant pour vérifier sa sécurité.\r\n- Contourner le mode silencieux: envoyez un signal fort audible même si le téléphone est en silencieux ou dans un sac.\r\n- Alertes de mouvement: ajoutez école, maison ou parc et recevez des notifications à l’arrivée et au départ.\r\n- Signal SOS sur le téléphone de l’enfant: l’enfant peut vous alerter immédiatement en appuyant sur le bouton SOS.\r\n\r\nGrâce à ce traqueur de téléphone portable, la géolocalisation devient simple et utile au quotidien. Vous pouvez suivre la position GPS et voir la route empruntée, afin de comprendre les habitudes et d’anticiper les besoins. Les parents apprécient la clarté de la carte, la fiabilité du suivi de la position et la réactivité des alertes. Pour encore plus de sérénité, vous pouvez activer le signal sonore pour retrouver un appareil égaré et utiliser l’écoute du son ambiant lorsque la situation l’exige.\r\n\r\nUtilisez Find my kids pour localiser un portable par numéro en cas de besoin, vérifier ma position GPS, et bénéficier d’un traceur de téléphone efficace. Notre approche met la sécurité au premier plan: les données de géolocalisation sont utilisées pour vous informer, vous alerter et vous aider à prendre des décisions rapides. Que ce soit à l’école, à la maison ou lors d’activités, le suivi de la position et la géolocalisation téléphone vous assurent une visibilité continue et une communication plus sereine avec votre enfant.\r\n\r\nPour une géolocalisation téléphone précise, position GPS fiable, suivi de la position et traqueur de téléphone portable, choisissez Find my kids.\r\n\r\nSi vous rencontrez des problèmes techniques en utilisant Findmykids, vous pouvez toujours contacter l’assistance 24h/24 et 7j/7 de Findmykids via le chat de l’application ou par e‑mail à support@findmykids.org. Nous sommes toujours là pour vous aider!\r\n\r\nVous pouvez consulter nos documents:\r\n\r\nContrat d’utilisation - https://findmykids.org/docs/terms-of-use/ios/en\r\nPolitique de confidentialité - https://findmykids.org/docs/privacy-policy/ios/en", "developer": "LETEM LTD", "genre": "Parents", "headerImage": "https://play-lh.googleusercontent.com/j4ULfbEHZk5u-WHihagFWFyZyIhDC-eGz5qXgOUXZXnOCxgofUZZvhGPsIg2pw2246MQM3FocEQQ0AmfJHdW0Fs", "histogram": [69633, 29942, 97708, 289326, 1571594], "icon": "https://play-lh.googleusercontent.com/1xxhEalJmQZPdCdHbJ2cfABAmZn5vVB5kWPro0JjVmBAUHWLWfE0eKjQH3nO9IkQJCV7q3-Yu5-jWpLt_wdY", "inAppProductPrice": "0,29 € - 719,99 € si facturé via Play", "installs": "50  wokół telefonu.\r\n<b>Głośny sygnał<\/b> - wiemy, jak ważny jest nadzór rodzicielski – dlatego możesz w dowolnym momencie wysłać dziecku głośny sygnał.\r\n<b>Statystyki aplikacji<\/b> - zobacz, z jakich aplikacji korzysta Twoje dziecko i w razie potrzeby zastosuj filtr rodzicielski.\r\n<b>Kontrola poziomu baterii<\/b> - otrzymasz powiadomienie, gdy bateria w telefonie dziecka będzie bliska wyczerpaniu.\r\n<b>Rodzinny czat<\/b> - Find my kids to nie tylko śledzenie telefonu, ale również aplikacja umożliwiająca ciągły kontakt z dzieckiem za pomocą czatu.\r\n\r\n<b>Lokalizator telefonu<\/b>\r\nLokalizator Find my kids został stworzony, aby zapewnić dzieciom bezpieczeństwo i umożliwić rodzicom namierzanie telefonu lub zegarka GPS. Aplikacja nie może być stosowana potajemnie i dziecko musi wyrazić zgodę na śledzenie lokalizacji. Znajdź telefon dziecka w dowolnym momencie, ale zrób to za jego zgodą! Dane osobowe przetwarzane w aplikacji przechowywane są zgodnie z RODO.\r\n\r\n<b>Jak zacząć korzystać z Find my kids?<\/b>\r\n\r\n1) Zainstaluj Find my kids.\r\n2) Wybierz urządzenie dziecka: smartfon lub zegarek GPS.\r\n3) Zainstaluj aplikację Pingo! na smartfonie lub wpisz numer karty SIM z zegarka GPS.\r\n4) Znajdź telefon dziecka na mapie.\r\n\r\n<b>Jeśli dziecko ma telefon:<\/b>\r\n\r\nZainstaluj na nim aplikację Pingo! W przeciwieństwie do innych aplikacji nasza wykorzystuje GPS w trybie ekonomicznym. Aplikacja działa na telefonie dziecka jako lokalizator GPS, dzięki czemu namierzanie telefonu jest możliwe. Dzieci mogą rozmawiać z rodzicami i wysyłać im sygnał alarmowy, a jeśli zgubią telefon – wybrać opcję Znajdź moje urządzenie (Znajdź mój telefon) i bez problemu znaleźć swoją własność. Gdy dziecko naciśnie przycisk SOS, rodzic natychmiast otrzyma sygnał alarmowy na telefon.\r\n\r\n<b>Jeśli dziecko ma zegarek GPS:<\/b>\r\n\r\nZ aplikacją Find my kids połączyć można zegarek GPS lub smartwatch. Aplikacja działa z urządzeniami od Wonlex, Zgpax Watch, Smart Baby Watch, Smart Age Watch, Smart Pet Tracker, Smart Locator i podobnymi.\r\n\r\nFind my kids to lokalizator rodziny w języku polskim, umożliwiający namierzanie telefonu i śledzenie lokalizacji dziecka w czasie rzeczywistym. W przypadku problemów technicznych skontaktuj się z naszą obsługą techniczną dostępną 24/7 przez czat lub wysyłając do nas wiadomość na adres support@findmykids.org.\r\n\r\nPo połączeniu z telefonem dziecka otrzymasz dostęp do okresu próbnego, w czasie którego można korzystać ze wszystkich funkcji aplikacji – w tym funkcji Znajdź moje urządzenie (Znajdź mój telefon). Po jego zakończeniu, Find my kids pozostawia możliwość podglądu lokalizacji dziecka. Aby móc korzystać z innych funkcji, należy kupić subskrypcję.\r\n<b>Aplikacja Find my kids prosi o poniższe zgody:<\/b>\r\n- dostęp do kamery i zdjęć, w celu przesłania zdjęcia dziecka,\r\n- dostęp do kontaktów, aby uzupełnić książkę telefoniczną w zegarku GPS,\r\n- dostęp do mikrofonu, aby wysyłać wiadomości głosowe.\r\n- Funkcje specjalne - aby ograniczyć czas na ekranie smartfona\r\n\r\nŚledzenie lokalizacji nigdy nie było prostsze! Znajdź telefon swojego dziecka na mapie i zyskaj spokój ducha, na jaki zasługujesz!", "developer": "LETEM LTD", "genre": "Dla rodziców", "headerImage": "https://play-lh.googleusercontent.com/j4ULfbEHZk5u-WHihagFWFyZyIhDC-eGz5qXgOUXZXnOCxgofUZZvhGPsIg2pw2246MQM3FocEQQ0AmfJHdW0Fs", "histogram": [64811, 21514, 45069, 137497, 1789308], "icon": "https://play-lh.googleusercontent.com/1xxhEalJmQZPdCdHbJ2cfABAmZn5vVB5kWPro0JjVmBAUHWLWfE0eKjQH3nO9IkQJCV7q3-Yu5-jWpLt_wdY", "inAppProductPrice": "1,29 zł – 3 350,99 zł, jeśli rozliczasz się przez Play", "installs": "50 000 000+", "lastUpdatedOn": "2 paź 2026", "metrics": {"minInstalls": 50000000, "ratings": 2058269, "realInstalls": 82880689, "reviews": 18809, "score": 4.7320185}, "price": 0, "screenshots": ["https://play-lh.googleusercontent.com/VV3ZZ4p4yXp2WU4CEyMGfuXD5zgC5ph36yYZSe-AQ7NN3WnPJEq3qeaaPZkA58AB90JqVsYh6IzTsUo7XThZdEI", "https://   return `<div class="picker"><label for="page">Сторінка для ринку або мови</label>
    <select id="page">${o.html}</select>
    ${o.hasLangs ? "" : `<p class="note">Мовні версії з'являться після найближчого тижневого скану.</p>`}</div>`;
}
function bindPicker(){
  const s = $("#page"); if (s) s.onchange = () => { state.page = s.value; render(); };
}

/* ---------- сторінка в стилі Google Play ---------- */
function storePage(p, compact=false, own=false){
  if (!p) return `<div class="empty">Для цієї сторінки ще немає знімка. Оберіть інший ринок або мову.</div>`;
  const flags = [p.containsAds ? "Містить рекламу" : null, p.inAppProductPrice ? "Покупки в застосунку" : null].filter(Boolean).join(", ");
  const m = p.metrics || {};
  const shots = (p.screenshots || []).map(u =>
    `<button type="button" data-zoom="${esc(img(u,"h1600"))}" aria-label="Відкрити скріншот"><img loading="lazy" src="${esc(img(u, compact?"h340":"h480"))}" alt=""></button>`).join("");
  return `<article class="store${own?" own-col":""}">
    <div class="store-head">
      <img src="${esc(img(p.icon,"s144"))}" alt="">
      <div><h2 class="store-title">${esc(p.title)}</h2>
        <div class="store-dev">${esc(p.developer)}</div>
        ${flags ? `<div class="store-flags">${flags}</div>` : ""}</div>
    </div>
    <ul class="stats">
      <li><b>${m.score ? m.score.toFixed(1).replace(".",",") + " ★" : "—"}</b><span>${fmtNum(m.ratings)} оцінок</span></li>
      <li><b>${esc((p.installs||"—").replace(/[.,]000[.,]000[.,]000\+/,"B+").replace(/[.,]000[.,]000\+/,"M+").replace(/[.,]000\+/,"K+"))}</b><span>завантажень</span></li>
      ${compact ? "" : `<li><b>${esc(p.contentRating || "—")}</b><span>вік</span></li>`}
    </ul>
    ${shots ? `<div class="shots">${shots}</div>` : ""}
    <h3>Про застосунок</h3>
    <p class="summary">${esc(p.summary)}</p>
    ${compact ? "" : `<div class="desc" id="desc">${esc(p.description)}</div>
      <button class="linkish" type="button" id="more">Показати повністю</button>`}
    <dl class="facts">
      ${p.inAppProductPrice ? `<dt>Покупки</dt><dd>${esc(p.inAppProductPrice)}</dd>` : ""}
      ${p.genre ? `<dt>Категорія</dt><dd>${esc(p.genre)}</dd>` : ""}
      ${!compact && p.version ? `<dt>Версія</dt><dd>${esc(p.version)}</dd>` : ""}
      ${p.lastUpdatedOn ? `<dt>Оновлено</dt><dd>${esc(p.lastUpdatedOn)}</dd>` : ""}
      ${!compact && p._scanned ? `<dt>Знімок</dt><dd>${esc(p._scanned)}</dd>` : ""}
    </dl>
  </article>`;
}

/* ---------- графік росту ---------- */
function chart(series, idx, label){
  const pts = series.filter(r => r[idx] != null);
  if (pts.length < 2) return `<p class="note">${label}: графік з'явиться, коли буде хоча б два дні даних.</p>`;
  const W=600,H=150,P=28, xs=pts.map((_,i)=>i), ys=pts.map(r=>r[idx]);
  const min=Math.min(...ys), max=Math.max(...ys), span=(max-min)||1;
  const x=i=>P+(i/(pts.length-1))*(W-P*2), y=v=>H-P-((v-min)/span)*(H-P*2);
  const d=pts.map((r,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(r[idx]).toFixed(1)}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <text x="${P}" y="14">${esc(label)}: ${fmtNum(min)} → ${fmtNum(max)}</text>
    <text x="${P}" y="${H-6}">${esc(pts[0][0])}</text>
    <text x="${W-P}" y="${H-6}" text-anchor="end">${esc(pts.at(-1)[0])}</text></svg>`;
}
function delta(series, days){
  if (!series || series.length < 2) return null;
  const last = series.at(-1), cut = new Date(last[0]); cut.setDate(cut.getDate()-days);
  const past = series.filter(r => new Date(r[0]) <= cut);
  return past.length ? last[1] - past.at(-1)[1] : null;
}

/* ---------- вигляд апки ---------- */
function appView(id){
  const pages = DATA.pages[id] || {};
  if (!pages[state.page]) state.page = DATA.locales.find(k => pages[k]) || Object.keys(pages)[0] || state.page;
  const p = pages[state.page];
  const series = DATA.metrics[id] || [];
  const last = series.at(-1);
  const d7 = delta(series, 7), d30 = delta(series, 30);
  const prices = Object.entries(DATA.prices[id] || {});
  const usdMins = prices.map(([,e]) => e.min_usd).filter(v => v != null).sort((a,b)=>a-b);
  const median = usdMins.length ? usdMins[Math.floor(usdMins.length/2)] : null;
  const cheapest = prices.filter(([,e]) => e.min_usd != null).sort((a,b)=>a[1].min_usd-b[1].min_usd)[0];
  const own = new Set(DATA.ownScreens[id] || []);
  const langs = Object.keys(pages).filter(k => k.startsWith("lang:")).map(k => k.slice(5));
  const log = DATA.changes.filter(c => c.app === id).slice(0, 12);
  const fs = DATA.firstSeen[id]?.countries || {};
  const newMarkets = Object.entries(fs).filter(([,v]) => v !== "baseline").map(([cc]) => DATA.countryNames[cc] || cc);

  return `<div class="app-view">
    <div>${picker([id])}${storePage(p)}</div>
    <aside class="side">
      <section><h2>Масштаб і ріст</h2>
        <div class="row">
          <div><b class="big">${fmtNum(last?.[1])}</b><span>інсталлів, оцінка</span></div>
          <div><b class="big">${d7==null?"—":(d7>=0?"+":"")+fmtNum(d7)}</b><span>за 7 днів</span></div>
          <div><b class="big">${d30==null?"—":(d30>=0?"+":"")+fmtNum(d30)}</b><span>за 30 днів</span></div>
        </div>
        ${chart(series, 1, "Інсталли")}${chart(series, 2, "Оцінки")}
      </section>
      <section><h2>Монетизація</h2>
        ${prices.length ? `<div class="row">
          <div><b class="big">${usd(median)}</b><span>медіана найдешевшої покупки</span></div>
          <div><b class="big">${cheapest ? usd(cheapest[1].min_usd) : "—"}</b><span>найдешевше: ${esc(cheapest ? DATA.countryNames[cheapest[0]] : "")}</span></div>
        </div>
        <p class="note">Реклама: ${prices.some(([,e])=>e.containsAds) ? "є" : "немає"}. Усі країни у вкладці «Ціни по країнах».</p>`
        : `<p class="note">Ціни з'являться після тижневого скану.</p>`}
      </section>
      <section><h2>Ринки й локалізації</h2>
        <p class="note" style="margin:0 0 8px">Доступна в ${Object.values(DATA.prices[id]||{}).filter(e=>e.available).length} країнах зі скану.
          ${newMarkets.length ? `Нові ринки: ${esc(newMarkets.join(", "))}.` : ""}</p>
        ${own.size ? `<p class="note" style="margin:0 0 8px">Власні скріншоти, тобто справжня локалізація:</p>
          <div class="chips">${[...own].map(l => `<button class="chip strong" data-page="lang:${esc(l)}">${esc(DATA.labels["lang:"+l]||l)}</button>`).join("")}</div>`
          : `<p class="note">Мов із власними скріншотами ${langs.length ? "немає: решта мов, найімовірніше, автопереклад" : "поки не видно, потрібен тижневий скан"}.</p>`}
      </section>
      <section><h2>Останні зміни</h2>${logList(log, false)}</section>
    </aside></div>`;
}
function logList(items, withApp){
  if (!items.length) return `<p class="note">Змін ще не зафіксовано. Вони з'являться з наступних запусків.</p>`;
  return `<ul class="log">${items.map(c => `<li><time>${esc(c.date)}</time><div>
    ${withApp ? `<b>${esc(appById[c.app]?.name || c.app)}</b>: ` : ""}${c.kind==="market"?`<span class="mark">ринок</span>`:""}${esc(c.text)}
    ${c.where ? `<span class="where"> (${esc(c.where)})</span>` : ""}</div></li>`).join("")}</ul>`;
}

/* ---------- порівняння ---------- */
function compareView(){
  const ids = DATA.apps.map(a => a.id);
  const cols = ids.map(id => {
    const p = DATA.pages[id]?.[state.page];
    return p ? storePage(p, true, id===DATA.ownId)
      : `<div class="empty">${esc(appById[id].name)}: немає знімка для цієї сторінки.</div>`;
  }).join("");
  return `${picker(ids)}<div class="compare">${cols}</div>`;
}

/* ---------- ціни ---------- */
function pricesView(){
  const ids = DATA.apps.map(a => a.id);
  const ccs = [...new Set(ids.flatMap(id => Object.keys(DATA.prices[id]||{})))];
  if (!ccs.length) return `<div class="empty">Ціни з'являться після першого тижневого скану.</div>`;
  const ref = DATA.prices[DATA.ownId] || {};
  const sorted = ccs.sort((a,b) => state.priceSort === "own"
    ? (ref[a]?.min_usd ?? 1e9) - (ref[b]?.min_usd ?? 1e9)
    : (DATA.countryNames[a]||a).replace(/^\S+\s/,"").localeCompare((DATA.countryNames[b]||b).replace(/^\S+\s/,""), "uk"));
  const cell = (e) => {
    if (!e || !e.available) return `<td class="num">—</td>`;
    if (state.priceMode === "usd") return `<td class="num" title="${esc(e.iap||"")}">${usd(e.min_usd)} – ${usd(e.max_usd)}</td>`;
    return `<td class="num" title="${esc(e.iap||"")}">${fmtMoney(e.min_local,e.currency)} – ${fmtMoney(e.max_local,e.currency)}</td>`;
  };
  const rows = sorted.map(cc => {
    const mins = ids.map(id => DATA.prices[id]?.[cc]?.min_usd).filter(v => v != null);
    const low = Math.min(...mins);
    return `<tr><td>${esc(DATA.countryNames[cc]||cc)}</td>${ids.map(id => {
      const e = DATA.prices[id]?.[cc];
      return cell(e).replace('<td class="num"', `<td class="num${id===DATA.ownId?" own":""}${e?.min_usd===low && mins.length>1?" low":""}"`);
    }).join("")}</tr>`;
  }).join("");
  return `<div class="toolbar">
      <div class="seg" role="group" aria-label="Валюта">
        <button data-mode="usd" aria-pressed="${state.priceMode==="usd"}">У доларах</button>
        <button data-mode="local" aria-pressed="${state.priceMode==="local"}">У локальній валюті</button></div>
      <div class="seg" role="group" aria-label="Сортування">
        <button data-sort="country" aria-pressed="${state.priceSort==="country"}">За країною</button>
        <button data-sort="own" aria-pressed="${state.priceSort==="own"}">За нашою ціною</button></div>
      <span class="note" style="margin:0">Діапазон від найдешевшої до найдорожчої покупки. Виділено найнижчу вхідну ціну в країні; наведіть на клітинку, щоб побачити оригінал.</span>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Країна</th>${ids.map(id =>
      `<th class="num${id===DATA.ownId?" own":""}">${esc(appById[id].name)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

/* ---------- хроніка ---------- */
function logView(){
  const items = DATA.changes.filter(c => state.logApp === "all" || c.app === state.logApp);
  return `<div class="toolbar"><label class="note" for="logapp" style="margin:0">Застосунок</label>
    <select id="logapp"><option value="all">Усі</option>${DATA.apps.map(a =>
      `<option value="${esc(a.id)}" ${state.logApp===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
    ${logList(items, true)}`;
}

/* ---------- рендер ---------- */
function render(){
  writeHash(); renderTabs();
  const m = $("#main");
  if (state.tab === "compare") m.innerHTML = compareView();
  else if (state.tab === "prices") m.innerHTML = pricesView();
  else if (state.tab === "log") m.innerHTML = logView();
  else m.innerHTML = appView(state.tab);
  bindPicker();
  const more = $("#more"), desc = $("#desc");
  if (more && desc) more.onclick = () => { const o = desc.classList.toggle("open"); more.textContent = o ? "Згорнути" : "Показати повністю"; };
  m.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => { const d = $("#lightbox"); $("img", d).src = b.dataset.zoom; d.showModal(); });
  m.querySelectorAll("[data-page]").forEach(b => b.onclick = () => { state.page = b.dataset.page; render(); window.scrollTo({top:0}); });
  m.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { state.priceMode = b.dataset.mode; render(); });
  m.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => { state.priceSort = b.dataset.sort; render(); });
  const la = $("#logapp"); if (la) la.onchange = () => { state.logApp = la.value; render(); };
}

$("#stamp").textContent = `Google Play, дані на ${DATA.generated}`;
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") e.target.close(); });
readHash(); render();
</script>
</body>
</html>
